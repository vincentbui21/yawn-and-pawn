# CI (Story 1.2, AD-14): every pull request and every push to main runs the quality gate, builds the release
# bundle (R8, unsigned) and runs the emulator smoke test on a Gradle Managed Device.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quality gate, release bundle and device smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LOG_DIR: build-logs
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test the secrets guard
        run: bash .github/scripts/test-check-no-tracked-secrets.sh

      - name: Fail if secrets are tracked by git
        run: bash .github/scripts/check-no-tracked-secrets.sh

      # After the full build the runner has too little disk left for the emulator ("does not have
      # enough disk space to run avd"). Remove large preinstalled toolchains this project never uses.
      # Runs before setup-java, so nothing this job installs is removed.
      - name: Free disk space for the emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      # checkSoundLoudness (Story 1.17) measures the bundled alarm sounds with ffmpeg's ebur128 filter.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -version | head -n 1

      # Story 1.19: the debug Firebase project's config, only when the secret is set (never for forks). Without it the
      # build uses the no-op crash reporter and the quality gate still passes.
      - name: Write google-services.json (debug Firebase project)
        env:
          GOOGLE_SERVICES_JSON_DEBUG: ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_DEBUG" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_DEBUG" > androidApp/google-services.json
            echo "google-services.json written: Firebase plugins apply."
          else
            echo "GOOGLE_SERVICES_JSON_DEBUG is not set: building without Firebase."
          fi

      - name: Quality gate
        run: |
          set -o pipefail
          mkdir -p "$LOG_DIR"
          ./gradlew qualityGate --continue 2>&1 | tee "$LOG_DIR/qualityGate.log"

      - name: Release bundle (R8, unsigned)
        run: |
          set -o pipefail
          ./gradlew :androidApp:bundleRelease 2>&1 | tee "$LOG_DIR/bundleRelease.log"

      # The runner image lacks libpulse0, which the emulator's qemu binary links against
      # (without it the managed device exits with an empty error message).
      - name: Enable KVM and install emulator system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The Gradle daemon (-Xmx4g) and the Kotlin daemon (-Xmx3g) left over from the quality gate and the release bundle
      # hold several GB the emulator needs: with them running, the runner killed this step (exit 143) during emulator
      # boot. Stop them first and run without a daemon, compiling Kotlin in the build process with a smaller heap.
      - name: Smoke test on a managed device (ATD, API 34)
        run: |
          set -o pipefail
          ./gradlew --stop || true
          pkill -f KotlinCompileDaemon || true
          free -m
          ./gradlew :androidApp:atdApi34DebugAndroidTest --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            2>&1 | tee "$LOG_DIR/managedDevice.log"

      - name: Name the failing Gradle tasks in the job summary
        if: failure()
        run: |
          failed="$(grep -hoE "Execution failed for task '[^']+'" "$LOG_DIR"/*.log 2>/dev/null \
            | sed -E "s/Execution failed for task '([^']+)'/\1/" | sort -u || true)"
          {
            echo "### CI failed"
            echo
            if [ -n "$failed" ]; then
              echo "Failing Gradle task(s):"
              echo
              printf -- '- `%s`\n' $failed
            else
              echo "No failing Gradle task was reported (a setup step or Gradle configuration failed); see the step logs."
            fi
            echo
            echo "Test, lint and screenshot reports are attached as the \`reports\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          for task in $failed; do echo "::error title=Gradle task failed::$task"; done
          # Memory and disk at the failure, for a step the runner killed (exit 143) without a Gradle error.
          free -m; df -h /

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build-logs/
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/
            **/build/outputs/androidTest-results/
