# CI (Story 1.2, AD-14): every pull request and every push to main runs the quality gate, builds the release
# bundle (R8, unsigned) and runs the emulator smoke test on a Gradle Managed Device.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quality gate, release bundle and device smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LOG_DIR: build-logs
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test the secrets guard
        run: bash .github/scripts/test-check-no-tracked-secrets.sh

      - name: Fail if secrets are tracked by git
        run: bash .github/scripts/check-no-tracked-secrets.sh

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Quality gate
        run: |
          set -o pipefail
          mkdir -p "$LOG_DIR"
          ./gradlew qualityGate --continue 2>&1 | tee "$LOG_DIR/qualityGate.log"

      - name: Release bundle (R8, unsigned)
        run: |
          set -o pipefail
          ./gradlew :androidApp:bundleRelease 2>&1 | tee "$LOG_DIR/bundleRelease.log"

      # The runner image lacks libpulse0, which the emulator's qemu binary links against
      # (without it the managed device exits with an empty error message).
      - name: Enable KVM and install emulator system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on a managed device (ATD, API 34)
        run: |
          set -o pipefail
          ./gradlew :androidApp:atdApi34DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true \
            --info 2>&1 | tee "$LOG_DIR/managedDevice.log"

      # TEMPORARY (Story 1.2 CI bring-up): boot the same AVD by hand to see whether and how it fails.
      - name: Diagnose emulator boot
        if: failure()
        continue-on-error: true
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          grep -iE "emulator.*-avd|emulator command|launching emulator|kernel" "$LOG_DIR/managedDevice.log" | head -20 || true
          export ANDROID_AVD_HOME="$HOME/.android/avd/gradle-managed"
          "$SDK/emulator/emulator" -avd dev34_aosp_atd_x86_64_Pixel_6 -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -read-only > emu.log 2>&1 &
          emu=$!
          for i in $(seq 1 48); do
            if ! kill -0 "$emu" 2>/dev/null; then echo "emulator process exited after $((i*5)) s"; break; fi
            booted="$("$SDK/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$booted" = "1" ]; then echo "BOOTED after $((i*5)) s"; break; fi
            sleep 5
          done
          kill "$emu" 2>/dev/null || true
          echo "--- emulator log (errors/warnings) ---"
          grep -iE "error|fatal|warn|crash|abort|signal" emu.log | grep -v FeatureControl | head -40 || true
          echo "--- emulator log tail ---"
          tail -40 emu.log

      - name: Name the failing Gradle tasks in the job summary
        if: failure()
        run: |
          failed="$(grep -hoE "Execution failed for task '[^']+'" "$LOG_DIR"/*.log 2>/dev/null \
            | sed -E "s/Execution failed for task '([^']+)'/\1/" | sort -u || true)"
          {
            echo "### CI failed"
            echo
            if [ -n "$failed" ]; then
              echo "Failing Gradle task(s):"
              echo
              printf -- '- `%s`\n' $failed
            else
              echo "No failing Gradle task was reported (a setup step or Gradle configuration failed); see the step logs."
            fi
            echo
            echo "Test, lint and screenshot reports are attached as the \`reports\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          for task in $failed; do echo "::error title=Gradle task failed::$task"; done

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build-logs/
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/
            **/build/outputs/androidTest-results/
