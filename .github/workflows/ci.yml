# CI (Story 1.2, AD-14): every pull request and every push to main runs the quality gate, builds the release
# bundle (R8, unsigned) and runs the emulator smoke test on a Gradle Managed Device.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quality gate, release bundle and device smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LOG_DIR: build-logs
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test the secrets guard
        run: bash .github/scripts/test-check-no-tracked-secrets.sh

      - name: Fail if secrets are tracked by git
        run: bash .github/scripts/check-no-tracked-secrets.sh

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Quality gate
        run: |
          set -o pipefail
          mkdir -p "$LOG_DIR"
          ./gradlew qualityGate --continue 2>&1 | tee "$LOG_DIR/qualityGate.log"

      - name: Release bundle (R8, unsigned)
        run: |
          set -o pipefail
          ./gradlew :androidApp:bundleRelease 2>&1 | tee "$LOG_DIR/bundleRelease.log"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on a managed device (ATD, API 34)
        run: |
          set -o pipefail
          ./gradlew :androidApp:atdApi34DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            2>&1 | tee "$LOG_DIR/managedDevice.log"

      # TEMPORARY (Story 1.2 CI bring-up): the managed emulator exits with an empty error message.
      # Capture why, then remove this step.
      - name: Diagnose emulator start failure
        if: failure()
        continue-on-error: true
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls -l /dev/kvm || true
          "$SDK/emulator/emulator" -version | head -3 || true
          "$SDK/emulator/emulator" -accel-check || true
          echo "--- missing shared libraries ---"
          find "$SDK/emulator" -maxdepth 3 -type f \( -name 'qemu-system-x86_64*' -o -name 'emulator' \) \
            -exec sh -c 'echo "$1"; ldd "$1" | grep "not found" || true' _ {} \;
          echo "--- AVDs ---"
          find "$HOME/.android" "$HOME/.config/.android" -name '*.ini' -path '*avd*' 2>/dev/null | head
          avd_ini="$(find "$HOME/.android" "$HOME/.config/.android" -name 'dev34_aosp_atd_x86_64_Pixel_6.ini' 2>/dev/null | head -1)"
          if [ -n "$avd_ini" ]; then
            export ANDROID_AVD_HOME="$(dirname "$avd_ini")"
            echo "--- direct emulator launch (90 s) ---"
            timeout 90 "$SDK/emulator/emulator" -avd dev34_aosp_atd_x86_64_Pixel_6 -no-window -no-audio \
              -gpu swiftshader_indirect -no-snapshot -verbose 2>&1 | tail -60 || true
          fi

      - name: Name the failing Gradle tasks in the job summary
        if: failure()
        run: |
          failed="$(grep -hoE "Execution failed for task '[^']+'" "$LOG_DIR"/*.log 2>/dev/null \
            | sed -E "s/Execution failed for task '([^']+)'/\1/" | sort -u || true)"
          {
            echo "### CI failed"
            echo
            if [ -n "$failed" ]; then
              echo "Failing Gradle task(s):"
              echo
              printf -- '- `%s`\n' $failed
            else
              echo "No failing Gradle task was reported (a setup step or Gradle configuration failed); see the step logs."
            fi
            echo
            echo "Test, lint and screenshot reports are attached as the \`reports\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          for task in $failed; do echo "::error title=Gradle task failed::$task"; done

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build-logs/
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/
            **/build/outputs/androidTest-results/
