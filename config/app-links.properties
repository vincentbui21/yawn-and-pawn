# Links the app opens outside itself (Story 4.17). The build reads this file into BuildConfig (androidApp), so changing a
# value here is the only edit needed.
#
# support.email: where "Email support" on "Problem with a charge?" writes to. A placeholder until a dedicated support
# address exists (owner action before launch, see epic-4-context.md "Later"). It is also published on the site's support
# and privacy pages (docs/site/), and checkSitePages fails unless both pages show this address.
support.email=vincentbui2108@gmail.com
# play.orderHistory: Google Play's order history, where the user can request a refund (FR-SET-5).
play.orderHistory=https://play.google.com/store/account/orderhistory
#
# The GitHub Pages site (Story 5.7), published from docs/site/ by .github/workflows/pages.yml. checkSitePages fails unless
# each *.url is the site's url + baseurl (docs/site/_config.yml) + the page's permalink.
privacy.url=https://vincentbui21.github.io/yawn-and-pawn/privacy/
terms.url=https://vincentbui21.github.io/yawn-and-pawn/terms/
support.url=https://vincentbui21.github.io/yawn-and-pawn/support/
