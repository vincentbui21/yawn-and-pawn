# Links the app opens outside itself (Story 4.17). The build reads this file into BuildConfig (androidApp), so changing a
# value here is the only edit needed.
#
# support.email: where "Email support" on "Problem with a charge?" writes to. The dedicated support address on the
# owner's domain since 2026-10-30 (Cloudflare Email Routing forwards it). It is also published on the site's support
# and privacy pages (docs/site/), and checkSitePages fails unless both pages show this address.
support.email=support@yawnandpawn.com
# play.orderHistory: Google Play's order history, where the user can request a refund (FR-SET-5).
play.orderHistory=https://play.google.com/store/account/orderhistory
#
# The GitHub Pages site (Story 5.7), published from docs/site/ by .github/workflows/pages.yml. checkSitePages fails unless
# each *.url is the site's url + baseurl (docs/site/_config.yml) + the page's permalink. index.url is the home page,
# which About's "Website" row opens (0.1.7 polish).
index.url=https://yawnandpawn.com/
privacy.url=https://yawnandpawn.com/privacy/
terms.url=https://yawnandpawn.com/terms/
support.url=https://yawnandpawn.com/support/
