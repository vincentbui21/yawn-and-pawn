# detekt configuration, applied on top of the detekt default config (buildUponDefaultConfig = true).
# Only overrides live here. Later stories add rules to :detekt-rules.

config:
  validation: true
  # The yawn-and-pawn rule set is provided by :detekt-rules, which the root project and
  # :detekt-rules itself do not load, so its key is skipped by config validation.
  excludes:
    - 'yawn-and-pawn.*'

naming:
  FunctionNaming:
    # Composables are PascalCase; test names are backticked sentences.
    ignoreAnnotated:
      - 'Composable'
    excludes: &testSources
      - '**/test/**'
      - '**/*Test/**'
      - '**/testDebug/**'
      - '**/testRelease/**'

# Custom rules from :detekt-rules (config/detekt-rules).
yawn-and-pawn:
  active: true
  NoPrintlnInCore:
    active: true
    # :core logs only through the Logger port (Architecture Conventions: Logging).
    includes:
      - '**/core/src/**'
  # Time only through the Clock/MonotonicClock/BootCounter/TimeZoneProvider ports (AD-3, Story 1.6).
  # App modules only (build tooling is not scoped); package com.yawnandpawn.app.android (the Android
  # adapters) is exempt inside the rule.
  NoDirectTimeAccess:
    active: true
    includes:
      - '**/core/src/**'
      - '**/data/src/**'
      - '**/composeApp/src/**'
      - '**/androidApp/src/**'
      - '**/testing/src/**'
  # Design tokens only (AD-10, Story 1.3). Active for every module; code in a package ending
  # in ui.theme (where PpsTheme is built from the generated PpsTokens) is exempt inside the rules.
  NoRawColor:
    active: true
  NoRawCornerRadius:
    active: true
  NoRawSp:
    active: true
  # Alarms only through AlarmScheduler and AlarmManager.setAlarmClock(), no inexact fallback (AD-4, Story 1.10).
  # Active for every module; it only looks at files that import or name android.app.AlarmManager.
  NoInexactAlarm:
    active: true

# Test source sets detekt's defaults do not know (androidHostTest, testDebug) are tests too.
complexity:
  TooManyFunctions:
    excludes: *testSources

style:
  MagicNumber:
    excludes: *testSources
  MaxLineLength:
    # Same limit as ktlint (.editorconfig).
    maxLineLength: 140
  UnusedImport:
    active: true
