# detekt configuration, applied on top of the detekt default config (buildUponDefaultConfig = true).
# Only overrides live here. Later stories add rules (time ports, raw colours, ...) to :detekt-rules.

config:
  validation: true
  # The yawn-and-pawn rule set is provided by :detekt-rules, which the root project and
  # :detekt-rules itself do not load, so its key is skipped by config validation.
  excludes:
    - 'yawn-and-pawn.*'

naming:
  FunctionNaming:
    # Composables are PascalCase; test names are backticked sentences.
    ignoreAnnotated:
      - 'Composable'
    excludes: &testSources
      - '**/test/**'
      - '**/*Test/**'
      - '**/testDebug/**'
      - '**/testRelease/**'

# Custom rules from :detekt-rules (config/detekt-rules).
yawn-and-pawn:
  active: true
  NoPrintlnInCore:
    active: true
    # :core logs only through the Logger port (Architecture Conventions: Logging).
    includes:
      - '**/core/src/**'
  # Design tokens only (AD-10, Story 1.3). Active for every module; code in a package ending
  # in ui.theme (where PpsTheme is built from the generated PpsTokens) is exempt inside the rules.
  NoRawColor:
    active: true
  NoRawCornerRadius:
    active: true
  NoRawSp:
    active: true

# Test source sets detekt's defaults do not know (androidHostTest, testDebug) are tests too.
complexity:
  TooManyFunctions:
    excludes: *testSources

style:
  MagicNumber:
    excludes: *testSources
  MaxLineLength:
    # Same limit as ktlint (.editorconfig).
    maxLineLength: 140
  UnusedImport:
    active: true
